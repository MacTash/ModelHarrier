[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-harrier"
version = "0.3.0.dev0"
description = "Static supply-chain security scanner and TUI for machine-learning models"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ModelHarrier Contributors"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "rich>=13.0",
    "textual>=0.80",
    "huggingface-hub>=0.30",
    "requests>=2.32",
    "picklescan>=1.0.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
fickling = ["fickling>=0.1.11"]
tensortrap = ["tensortrap>=1.2.0"]
sklearn = ["scikit-learn>=1.6"]
garak = ["garak>=0.15.1"]
pdf = ["fpdf2>=2.8"]
all = [
    "fickling>=0.1.11",
    "tensortrap>=1.2.0",
    "scikit-learn>=1.6",
    "garak>=0.15.1",
    "fpdf2>=2.8",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/MacTash/ModelHarrier"
Issues = "https://github.com/MacTash/ModelHarrier/issues"

[project.scripts]
model-harrier = "model_harrier.cli:app"
harrier = "model_harrier.cli:app"
ai-eye = "model_harrier.cli:app"

[tool.setuptools.packages.find]
include = ["model_harrier*"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-select = [
    "I",
    "W",
    "E",
    "N",
    "D",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D"]
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_unimported = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
